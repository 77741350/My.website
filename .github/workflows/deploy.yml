name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK secret is not set. Skipping deploy."
            echo "Add your Render Deploy Hook URL as a GitHub secret named RENDER_DEPLOY_HOOK"
          fi
