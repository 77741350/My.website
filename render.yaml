databases:
  - name: pmstore-db
    databaseName: pmstore
    user: pmstore
    plan: free

services:
  - type: web
    name: pmstore
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pmstore-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
